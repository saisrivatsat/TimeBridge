name: Feature request
description: Suggest an improvement grounded in a user problem
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation before proposing a particular interface.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What workarounds have you tried?
